name: Build MusicFree TV Bundle
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 MusicFree 0.6.2 源码
        uses: actions/checkout@v4
        with:
          repository: 'maotoumao/MusicFree'
          ref: 'v0.6.2'
          path: MusicFree

      - name: 拉取我们的补丁文件
        uses: actions/checkout@v4
        with:
          path: patches

      - name: 覆盖TV补丁
        run: |
          cp -r patches/src/* MusicFree/src/
          cp patches/android/app/src/main/AndroidManifest.xml MusicFree/android/app/src/main/AndroidManifest.xml

      - name: 安装Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MusicFree/package-lock.json

      - name: 安装依赖
        run: cd MusicFree && npm install

      - name: 打包bundle
        run: cd MusicFree && npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output bundle/index.android.bundle --assets-dest bundle/res

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: musicfree-tv-bundle
          path: MusicFree/bundle/
